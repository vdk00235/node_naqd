<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration | naqd</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #f43f5e; /* Rose/Red for Admin */
            --primary-hover: #e11d48;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --error: #ef4444;
            --success: #10b981;
            --radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(244, 63, 94, 0.15);
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .auth-header { text-align: center; margin-bottom: 25px; }
        .auth-header .badge {
            background: rgba(244, 63, 94, 0.1);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: inline-block;
        }
        .auth-header h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; }

        .avatar-upload {
            position: relative;
            max-width: 110px;
            margin: 0 auto 25px auto;
        }
        .avatar-preview {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #334155;
            overflow: hidden;
            background: #334155;
            cursor: pointer;
        }
        .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-edit { position: absolute; right: 0; bottom: 0; }
        .avatar-edit input { display: none; }
        .avatar-edit label {
            width: 30px; height: 30px; border-radius: 50%;
            background: var(--primary); display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: 2px solid var(--card-bg);
        }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--text-muted); }

        input {
            width: 100%; padding: 12px 16px; background: #334155; border: 1px solid #475569;
            border-radius: 8px; color: white; font-size: 1rem; outline: none;
        }
        input:focus { border-color: var(--primary); }

        .btn-submit {
            width: 100%; padding: 14px; background: var(--primary); color: white;
            border: none; border-radius: 8px; font-size: 1rem; font-weight: 600;
            cursor: pointer; margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-submit:hover { background: var(--primary-hover); }

        .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .message { font-size: 0.85rem; margin-top: 15px; padding: 12px; border-radius: 8px; display: none; text-align: center; }
        .message.error { display: block; background: rgba(239, 68, 68, 0.1); color: var(--error); border: 1px solid rgba(239, 68, 68, 0.2); }
        .message.success { display: block; background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }

        .auth-footer { text-align: center; margin-top: 25px; font-size: 0.9rem; color: var(--text-muted); }
        .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-header">
            <span class="badge">Restricted Access</span>
            <h1>Admin Setup</h1>
            <p>Create a secure administrator account</p>
        </div>

        <form id="adminForm">
            <div class="avatar-upload">
                <div class="avatar-edit">
                    <input type='file' id="imageUpload" accept="image/*" />
                    <label for="imageUpload">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    </label>
                </div>
                <div class="avatar-preview" onclick="document.getElementById('imageUpload').click()">
                    <img id="imagePreview" src="https://via.placeholder.com/150?text=Admin" alt="Preview">
                </div>
            </div>

            <div class="form-group">
                <label>Admin Name</label>
                <input type="text" id="name" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required minlength="6">
            </div>

            <div class="form-group">
                <label>Admin Secret Key</label>
                <input type="password" id="adminKey" placeholder="Enter key to authorize" required>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="spinner" id="spinner"></span>
                <span id="btnText">Create Admin</span>
            </button>

            <div id="msg" class="message"></div>
        </form>

        <div class="auth-footer">
            Return to <a href="login.html">Login</a>
        </div>
    </div>

    <script>
        const imageUpload = document.getElementById('imageUpload');
        const imagePreview = document.getElementById('imagePreview');
        const adminForm = document.getElementById('adminForm');
        const submitBtn = document.getElementById('submitBtn');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btnText');
        const msg = document.getElementById('msg');

        imageUpload.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => imagePreview.src = e.target.result;
                reader.readAsDataURL(file);
            }
        });

        async function safeFetch(url, options) {
            try {
                const res = await fetch(url, options);
                const text = await res.text();
                console.log(`[DEBUG] Response from ${url}:`, text);
                
                try {
                    const data = JSON.parse(text);
                    return { ok: res.ok, status: res.status, data };
                } catch (e) {
                    console.error("Non-JSON response received:", text);
                    return { ok: false, status: res.status, message: "Invalid server response" };
                }
            } catch (err) {
                console.error("Fetch error:", err);
                return { ok: false, message: "Network error or server unreachable" };
            }
        }

        adminForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            msg.className = 'message';
            msg.style.display = 'none';
            submitBtn.disabled = true;
            spinner.style.display = 'block';
            btnText.textContent = 'Verifying...';

            const formData = new FormData();
            formData.append('name', document.getElementById('name').value);
            formData.append('password', document.getElementById('password').value);
            formData.append('adminKey', document.getElementById('adminKey').value);
            if (imageUpload.files[0]) formData.append('avatar', imageUpload.files[0]);

            // safeFetch doesn't support FormData directly in its internal text() logging easily if it's large, but let's adapt it.
            try {
                const res = await fetch('http://localhost:3000/api/auth/register-admin', {
                    method: 'POST',
                    body: formData
                });
                const text = await res.text();
                console.log("[DEBUG] Raw response:", text);

                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    throw new Error("Invalid server response (not JSON)");
                }

                if (!res.ok) throw new Error(data.message || 'Verification failed');

                msg.className = 'message success';
                msg.textContent = 'Admin authorized! Redirecting...';
                msg.style.display = 'block';
                setTimeout(() => window.location.href = 'login.html', 2000);

            } catch (err) {
                msg.className = 'message error';
                msg.textContent = err.message;
                msg.style.display = 'block';
                submitBtn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = 'Create Admin';
            }
        });
    </script>
</body>
</html>
