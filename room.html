<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Room | naqd</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <link rel="stylesheet" href="./styles/room.css">
</head>

<body>

    <header>
        <div class="owner-info">
            <img id="ownerAvatar" src="https://via.placeholder.com/45" class="owner-avatar">
            <div>
                <div style="font-weight: 800;" id="roomName">Loading Room...</div>
                <div class="viewer-count">
                    <span style="color: #10b981;">●</span> <span id="viewers">0</span> viewers
                </div>
            </div>
        </div>
        <button id="leaveBtn" class="btn btn-leave">Leave Room</button>
    </header>

    <main>
        <div class="mic-section">
            <div id="micGrid" class="mic-grid">
                <!-- Mics rendered dynamically -->
            </div>

            <div class="controls">
                <button id="joinMicBtn" class="btn btn-join-mic" onclick="requestMic()">Request Mic</button>
                <button id="muteBtn" class="btn btn-mute" style="display: none;" onclick="toggleMute()">Mute</button>
            </div>
        </div>

        <div class="chat-section">
            <div class="chat-header">Live Chat</div>
            <div id="messages" class="messages"></div>
            <div class="input-area">
                <textarea id="chatInput" rows="1" placeholder="Say something..."></textarea>
                <button class="btn-send" onclick="sendMsg()">Send</button>
            </div>
        </div>
    </main>

    <div id="ownerPanel">
        <div
            style="font-weight: 800; font-size: 0.8rem; color: var(--muted); border-bottom: 1px solid #334155; padding-bottom: 8px;">
            MIC QUEUE</div>
        <div id="queueList"></div>
    </div>

    <script>
        let pendingMembers = [];
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('id');
        const token = localStorage.getItem('token');
        const currentUser = JSON.parse(localStorage.getItem('user'));

        if (!token || !roomId) window.location.href = 'rooms.html';

        const socket = io("http://localhost:3000", { auth: { token } });
        let currentRole = 'listener';
        let isMuted = false;
        let localStream = null;
        let peers = {}; // WebRTC connections
        let pcConfig = {
            iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
        };

        async function loadOldMessages() {
            const res = await fetch(`http://localhost:3000/api/rooms/messages/${roomId}`, {
                headers: { Authorization: `Bearer ${token}` }
            });

            const msgs = await res.json();

            msgs.forEach(msg => renderMessage(msg));
        }
        document.getElementById('leaveBtn').onclick = () => {
            socket.emit("room:leave", { roomId });
            window.location.href = 'rooms.html';
        };

        // 1. Initial Join
        socket.emit("room:join", { roomId });
        loadOldMessages();
        socket.on("room:force_mute", () => {
            if (localStream) {
                localStream.getAudioTracks()[0].enabled = false;
                isMuted = true;
            }
        });
        socket.on("room:mic_accepted", async () => {
            await startStreaming(); // مهم ينتظر
            socket.emit("room:get_members_for_webrtc", { roomId });
        });
        // 2. UI Updates
        socket.on("room:update_state", (state) => {
            const { members, owner } = state;
            document.getElementById('roomName').textContent = "Audio Room";
            document.getElementById('ownerAvatar').src = owner.avatar ? `http://localhost:3000/uploads/${owner.avatar}` : 'https://via.placeholder.com/45';
            if (currentRole === 'owner') {
                document.getElementById('leaveBtn').textContent = "Close Room";
            }
            // Viewers count
            const viewers = members.filter(m => m.is_online).length;
            document.getElementById('viewers').textContent = viewers;

            // Render Mic Grid
            renderMics(members);

            // Set Role
            const me = members.find(m => m.user_id == currentUser.id);
            if (me) {
                currentRole = me.role;
                updateControls();
                if (currentRole === 'owner') document.getElementById('ownerPanel').style.display = 'block';
            }
            pendingMembers = state.members;

        });
        function connectToMembers() {
            if (!localStream) return;

            pendingMembers.forEach(m => {
                if (m.user_id !== currentUser.id && !peers[m.user_id]) {
                    createPeer(m.user_id);
                }
            });
        }

        socket.on("room:members_list", (members) => {
            pendingMembers = members;

            if (localStream) {
                connectToMembers();  // ✅ هنا المكان الصحيح
            }
        });
        function renderMics(members) {
            const grid = document.getElementById('micGrid');
            grid.innerHTML = '';

            // Fixed slots (example: 10 mics)
            const maxMics = 10;
            const speakers = members.filter(m => ['owner', 'speaker'].includes(m.role));

            for (let i = 0; i < maxMics; i++) {
                const user = speakers[i];
                const slot = document.createElement('div');
                slot.className = 'mic-slot';

                if (user) {
                    const avatar = user.avatar ? `http://localhost:3000/uploads/${user.avatar}` : 'https://via.placeholder.com/85';
                    slot.innerHTML = `
<div class="mic-circle active">
    <img src="${avatar}">
    ${user.role === 'owner' ? '<span class="mic-badge">OWNER</span>' : ''}
    
    ${currentRole === 'owner' && user.user_id !== currentUser.id ?
                            `<span onclick="muteUser(${user.user_id})" class="mute-btn">🔇</span>`
                            : ''}

</div>
<div class="mic-name">${user.name}</div>
`;

                } else {
                    slot.innerHTML = `<div class="mic-circle empty-mic"></div><div class="mic-name">Empty</div>`;
                }
                grid.appendChild(slot);
            }
        }

        function updateControls() {
            const joinBtn = document.getElementById('joinMicBtn');
            const muteBtn = document.getElementById('muteBtn');

            if (['owner', 'speaker'].includes(currentRole)) {
                joinBtn.style.display = 'none';
                muteBtn.style.display = 'block';
                startStreaming();
            } else {
                joinBtn.style.display = 'block';
                muteBtn.style.display = 'none';
            }
        }

        // 3. Mic Requests
        function requestMic() {
            socket.emit("room:request_mic", { roomId });
            document.getElementById('joinMicBtn').disabled = true;
            document.getElementById('joinMicBtn').textContent = 'Pending...';
        }

        socket.on("room:queue_update", (queue) => {
            const list = document.getElementById('queueList');
            list.innerHTML = queue.map(item => `
                <div class="queue-item">
                    <img style="width:10px;height:10px;border-radius:50%" src="${item.avatar ? 'http://localhost:3000/uploads/' + item.avatar : 'https://via.placeholder.com/30'}" class="queue-avatar">
                    <span style="font-size: 0.75rem; font-weight: 700;">${item.name}</span>
                    <div class="queue-actions">
                        <button class="q-btn q-accept" onclick="acceptMic(${item.user_id})">✓</button>
                        <button class="q-btn" style="background:#475569; color:white;" onclick="rejectMic(${item.user_id})">✕</button>
                    </div>
                </div>
            `).join('');
        });

        function acceptMic(targetUserId) { socket.emit("room:accept_request", { roomId, targetUserId }); }
        function rejectMic(targetUserId) { socket.emit("room:reject_request", { roomId, targetUserId }); }

        // 4. Messaging
        function sendMsg() {
            const input = document.getElementById('chatInput');
            if (!input.value.trim()) return;
            socket.emit("room:send_message", { roomId, message: input.value });
            input.value = '';
        }

        function renderMessage(msg) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');

            div.className = 'msg';

            const avatar = msg.avatar
                ? `http://localhost:3000/uploads/${msg.avatar}`
                : 'https://via.placeholder.com/30';

            div.innerHTML = `
        <img src="${avatar}" class="msg-avatar" loading="lazy">
        <div class="msg-content">
            <span class="msg-name">${msg.name || msg.fromUserName}</span>
            <div class="msg-text">${msg.content || msg.message}</div>
        </div>
    `;

            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        socket.on("room:new_message", renderMessage);
        // 5. Audio Streaming (WebRTC)
        async function startStreaming() {
            if (localStream) return;

            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    },
               
                });
                console.log("STEP 1: stream ready")
                if (localStream){
                    console.log({'loacalstream':localStream})
                }
                //console.log("[WEBRTC] Mic ready");

                
                socket.emit("room:get_members_for_webrtc", { roomId });

            } catch (err) {
                console.error("Mic access denied", err);
            }
        }


        async function createPeer(targetId) {
            if (!localStream) return;
            if (targetId === currentUser.id) return;
            if (peers[targetId]) return;

            const pc = new RTCPeerConnection(pcConfig);
            peers[targetId] = pc;
            pc.onconnectionstatechange = () => {
                if (pc.connectionState === "disconnected") {
                    delete peers[targetId]; // 🔥 هنا targetId
                }
            };
            // إرسال الصوت
            localStream.getTracks().forEach(track => {
                pc.addTrack(track, localStream);
            });

            // ICE
            pc.onicecandidate = (e) => {
                if (e.candidate) {
                    socket.emit("room:signal", {
                        to: targetId,
                        signal: e.candidate
                    });
                }
            };

            // استقبال الصوت
            pc.ontrack = (event) => {
                const existing = document.getElementById(`audio-${targetId}`);
                if (existing) existing.remove();

                if (targetId === currentUser.id) return;

                const audio = document.createElement("audio");
                audio.id = `audio-${targetId}`;
                audio.srcObject = event.streams[0];
                audio.autoplay = true;
                audio.playsInline = true;

                audio.play().catch(() => { });

                document.body.appendChild(audio);
            };



            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            socket.emit("room:signal", {
                to: targetId,
                signal: offer
            });
        }
        function toggleMute() {
            isMuted = !isMuted;
            if (localStream) localStream.getAudioTracks()[0].enabled = !isMuted;
            document.getElementById('muteBtn').textContent = isMuted ? 'Unmute' : 'Mute';
            document.getElementById('muteBtn').style.background = isMuted ? '#10b981' : 'var(--accent)';
        }
        socket.on("room:signal", async ({ from, signal }) => {
            if (!localStream) return;
            let pc = peers[from];
            if (from === currentUser.id) return;
            if (!pc) {
                pc = new RTCPeerConnection(pcConfig);
                peers[from] = pc;

                localStream.getTracks().forEach(track => {
                    pc.addTrack(track, localStream);
                });

                pc.onicecandidate = (e) => {
                    if (e.candidate) {
                        socket.emit("room:signal", {
                            to: from,
                            signal: e.candidate
                        });
                    }
                };

                pc.ontrack = (event) => {
                    const existing = document.getElementById(`audio-${from}`);
                    if (existing) existing.remove();
                    if (from === currentUser.id) return;
                    const audio = document.createElement("audio");
                    audio.id = `audio-${from}`;
                    audio.srcObject = event.streams[0];
                    audio.autoplay = true;

                    document.body.appendChild(audio);
                };
            }

            if (signal.type === "offer") {
                await pc.setRemoteDescription(signal);

                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);

                socket.emit("room:signal", {
                    to: from,
                    signal: answer
                });

            } else if (signal.type === "answer") {
                await pc.setRemoteDescription(signal);

            } else {
                await pc.addIceCandidate(signal);
            }
        });
        socket.on("room:error", (msg) => {
            alert(msg);
            if (msg === "Room is full") window.location.href = 'rooms.html';
        });

        socket.on("room:close", () => {
            alert("The room has been closed by the owner.");
            window.location.href = 'rooms.html';
        });

        window.onbeforeunload = () => { socket.emit("room:leave", { roomId }); };
        function kickUser(targetUserId) {
            if (currentRole !== 'owner') return;
            socket.emit("room:remove_speaker", { roomId, targetUserId });
        }

        function muteUser(targetUserId) {
            if (currentRole !== 'owner') return;

            // 🔥 منع mute نفسه
            if (targetUserId === currentUser.id) return;

            socket.emit("room:mute_user", { targetUserId });
        }
    </script>
</body>

</html>
