<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Rooms | naqd</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <link rel="stylesheet" href="./styles/rooms.css">
</head>

<body>

    <div id="statusToast" class="notification"></div>

    <div class="container">
        <header>
            <h1>Discover Rooms</h1>

            <div class="header-actions">
                <a href="/search.html" class="icon-btn" title="Search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </a>
                <a href="/chats.html" class="icon-btn" title="Chats">
                    <i class="fa-solid fa-message"></i>
                </a>
                <a href="/notifications.html" class="icon-btn" title="Notifications">
                    <i class="fa-solid fa-bell"></i>
                </a>
                <a href="create-room.html" class="btn-create">
                    <i class="fa-solid fa-plus"></i>
                    Create Room
                </a>
            </div>
        </header>

        <div id="roomsGrid" class="rooms-grid">
            <p style="text-align: center; grid-column: 1/-1;">Searching for active rooms...</p>
        </div>
    </div>
    <script>
        const API_URL = 'https://nodenaqd-production.up.railway.app/api/rooms';
        const START_URL = 'https://nodenaqd-production.up.railway.app/api/rooms/start';
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));

        if (!token) window.location.href = 'login.html';
        const socket = io("https://nodenaqd-production.up.railway.app", {
            auth: { token }
        });

        socket.on("room:close", () => {
            fetchRooms();
        });
        socket.on("rooms:update", (rooms) => {
            renderRooms(rooms);
        });
        async function fetchRooms() {
            try {
                const res = await fetch(API_URL, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.status === 401) {
                    window.location.href = 'login.html';
                    return;
                }

                if (!res.ok) throw new Error('Failed to fetch rooms');
                const rooms = await res.json();
                renderRooms(rooms);

            } catch (err) {
                console.error(err);
                showToast("error", "Unable to connect to the server.");
            }
        }

        function renderRooms(rooms) {
            const grid = document.getElementById('roomsGrid');
            grid.innerHTML = '';

            if (rooms.length === 0) {
                grid.innerHTML = '<p style="text-align: center; grid-column: 1/-1;">No rooms available yet.</p>';
                return;
            }

            rooms.forEach(room => {
                const isLive = room.isLive === 1;
                const isOwner = user && (room.creared_by == user.id);
                const isAdmin = user && (user.role === 'admin');

                const card = document.createElement('div');
                card.className = `room-card ${isLive ? 'is-live' : 'is-offline'}`;

                card.onclick = (e) => {
                    if (e.target.closest('.btn-start')) return;
                    if (!isLive) {
                        showToast("error", "Room not started yet.");
                        return;
                    }
                    window.location.href = `room.html?id=${room.id}`;
                };

                const logoUrl = room.logo ? (room.logo.startsWith('http') ? room.logo : `https://nodenaqd-production.up.railway.app${room.logo}`) : 'https://via.placeholder.com/300x180?text=Room+Logo';

                let startBtnHtml = '';
                if ((isOwner || isAdmin) && !isLive) {
                    startBtnHtml = `
                        <button class="btn-start" onclick="startRoom(${room.id})" title="Start Room">
                            <i class="fa-solid fa-play"></i>
                        </button>
                    `;
                }

                card.innerHTML = `
                    <div class="room-logo-wrapper">
                        <img src="${logoUrl}" class="room-logo" alt="${room.name}">
                        <span class="badge ${isLive ? 'live' : 'offline'}">
                            ${isLive ? '● LIVE' : 'OFFLINE'}
                        </span>
                        ${startBtnHtml}
                    </div>
                    <div class="room-content">
                        <div class="room-name">${room.name}</div>
                        <div class="room-meta">
                            <span><i class="fa-solid fa-users"></i> ${room.max_users} Max</span>
                            <span class="room-status">
                                <span class="status-dot ${room.status === 'active' ? 'dot-active' : 'dot-expired'}"></span>
                                ${room.status}
                            </span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function startRoom(roomId) {
            try {
                const res = await fetch(START_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ roomId })
                });

                const data = await res.json();

                if (res.ok) {
                    window.location.href = `room.html?id=${roomId}`;
                } else {
                    showToast("error", data.message || "Failed to start room");
                }
            } catch (err) {
                console.error(err);
                showToast("error", "Network error. Could not start room.");
            }
        }

        function showToast(type, msg) {
            const toast = document.getElementById('statusToast');
            toast.textContent = msg;
            toast.className = `notification ${type}`;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        fetchRooms();
    </script>
</body>

</html>
