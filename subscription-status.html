<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Status</title>

    <style>
        :root {
            --primary: #3b82f6;
            --bg: #f8fafc;
            --card: #fff;
            --text: #1e293b;
            --muted: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --radius: 14px;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui;
        }

        body {
            background: var(--bg);
            display: flex;
            justify-content: center;
            padding: 40px 16px;
            color: var(--text);
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--card);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .alert {
            padding: 14px;
            border-radius: 10px;
            background: #fff7ed;
            color: #9a3412;
            border: 1px solid #fed7aa;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .info {
            border-top: 1px solid #eee;
            margin-top: 15px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .label {
            color: var(--muted);
        }

        .value {
            font-weight: 700;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .active {
            background: #dcfce7;
            color: #166534;
        }

        .expired {
            background: #fee2e2;
            color: #991b1b;
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }

        .primary {
            background: var(--primary);
            color: white;
        }

        .outline {
            border: 1px solid #e2e8f0;
            color: var(--text);
            background: white;
        }

        .btn:hover {
            transform: scale(1.02);
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Subscription Status</h1>

        <div class="alert" id="msg">
            Loading...
        </div>

        <div class="info">

            <div class="row">
                <span class="label">Plan</span>
                <span class="value" id="planName">-</span>
            </div>

            <div class="row">
                <span class="label">Start</span>
                <span class="value" id="start">-</span>
            </div>

            <div class="row">
                <span class="label">End</span>
                <span class="value" id="end">-</span>
            </div>

            <div class="row">
                <span class="label">Room</span>
                <span class="value" id="room">-</span>
            </div>

            <div class="row">
                <span class="label">Status</span>
                <span id="status" class="badge">-</span>
            </div>

        </div>

        <div class="buttons">

            <a id="createBtn" class="btn primary hidden" href="create-room.html">Create Room</a>

            <a id="renewBtn" class="btn primary hidden" href="select-plan.html">Renew Subscription</a>

            <a class="btn outline" href="rooms.html">Back</a>

        </div>

    </div>

    <script>
        const token = localStorage.getItem("token");
        if (!token) location.href = "login.html";

        const API = "http://localhost:3000/api";

        async function load() {
            const res = await fetch(`${API}/subscriptions/me`, {
                headers: { Authorization: `Bearer ${token}` }
            });

            const data = await res.json();

            const msg = document.getElementById("msg");
            const createBtn = document.getElementById("createBtn");
            const renewBtn = document.getElementById("renewBtn");

            // ❌ لا يوجد اشتراك
            if (res.status === 404) {
                msg.textContent = "No subscription found";
                createBtn.classList.remove("hidden");
                return;
            }

            if (!res.ok) {
                msg.textContent = "Error loading data";
                return;
            }

            const sub = data.subscription;

            document.getElementById("planName").textContent = sub.plan_name;
            document.getElementById("start").textContent = new Date(sub.start_date).toLocaleDateString();
            document.getElementById("end").textContent = new Date(sub.end_date).toLocaleDateString();
            document.getElementById("room").textContent = sub.room_existe ? "Yes" : "No";

            const status = document.getElementById("status");
            status.textContent = sub.status;
            status.className = "badge " + sub.status;

            // =========================
            // المنطق الأساسي
            // =========================

            if (sub.status === "expired") {
                msg.textContent = "Subscription expired";
                renewBtn.classList.remove("hidden");
                return;
            }

            if (sub.status === "active") {
                if (sub.room_existe) {
                    msg.textContent = "Room already created";
                } else {
                    msg.textContent = "You can create a room";
                    createBtn.classList.remove("hidden");
                }
            }
        }

        load();
    </script>

</body>

</html>
